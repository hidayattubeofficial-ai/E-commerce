name: EmDash Foundation Check

on:
  push:
    paths:
      - "emdash/app/**"
      - "data/products.json"
      - ".github/workflows/emdash-check.yml"
  pull_request:
    paths:
      - "emdash/app/**"
      - "data/products.json"

permissions:
  contents: read

jobs:
  foundation-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emdash/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install EmDash dependencies
        run: npm install
      - name: Verify FM catalog bridge
        run: node tests/catalog-bridge.test.mjs
      - name: Typecheck Astro + EmDash
        run: npm run typecheck
      - name: Build Astro + Cloudflare worker
        run: npm run build

# Deliberately no deployment step.
# Production deployment remains human-approved and OFF.
