name: Hidayat E-commerce Automation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cmd:
        description: "Hidayat short command"
        required: false
        default: "H:TEST"
        type: string
      ai:
        description: "Use AI planning when OPENAI_API_KEY is configured"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: hidayat-automation-main
  cancel-in-progress: true

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run FM command
        env:
          HIDAYAT_CMD: ${{ inputs.cmd || 'H:TEST' }}
        run: |
          chmod +x scripts/fm.sh
          ./scripts/fm.sh "$HIDAYAT_CMD"

      - name: AI plan
        if: ${{ inputs.ai == true && secrets.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HIDAYAT_CMD: ${{ inputs.cmd || 'H:TEST' }}
        run: |
          node scripts/fm-ai.mjs "$HIDAYAT_CMD"

      - name: Fast validation
        run: |
          node --check scripts/fm-ai.mjs
          test -f README.md
          test -f fm.config.json

      - name: Commit automation state
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name "Hidayat Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
