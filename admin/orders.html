<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM E-commerce • Orders</title><link rel="stylesheet" href="/styles.css"></head><body><header><strong>FM Admin</strong><a href="/">Storefront</a></header><main class="admin-panel"><h1>Orders</h1><p>Order mutations and payment processing are disabled.</p><div id="status">Loading…</div><div id="orders" class="admin-grid"></div><p><a href="/admin/products.html">Products</a> · <a href="/admin/inventory.html">Inventory</a></p></main><script>fetch('/api/admin/orders').then(r=>r.json()).then(d=>{document.getElementById('status').textContent=d.ok?'Read-only':'Unavailable';document.getElementById('orders').innerHTML=d.orders.length?d.orders.map(o=>`<article class="admin-card"><h2>Order ${o.id}</h2></article>`).join(''):'<article class="admin-card"><h2>No orders yet</h2><p>Order storage is not enabled in this phase.</p></article>'}).catch(()=>document.getElementById('status').textContent='API unavailable');</script></body></html>
