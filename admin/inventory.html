<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM E-commerce • Inventory</title><link rel="stylesheet" href="/styles.css"></head><body><header><strong>FM Admin</strong><nav><a href="/admin/products.html">Products</a><a href="/admin/inventory.html">Inventory</a><a href="/admin/orders.html">Orders</a><a href="/admin/settings.html">Settings</a><a href="/">Storefront</a></nav></header><main class="admin-panel"><h1>Inventory</h1><p>Read-only stock view. Stock writes remain disabled.</p><div id="status">Loading…</div><div id="inventory" class="admin-grid"></div></main><script>fetch('/api/admin/inventory').then(r=>r.json()).then(d=>{document.getElementById('status').textContent=d.ok?'Read-only':'Unavailable';document.getElementById('inventory').innerHTML=d.inventory.map(p=>`<article class="admin-card"><h2>${p.name}</h2><p>SKU: ${p.id}</p><p>Stock: ${p.stock}</p><p>Status: ${p.active?'Active':'Inactive'}</p></article>`).join('')}).catch(()=>document.getElementById('status').textContent='API unavailable');</script></body></html>
