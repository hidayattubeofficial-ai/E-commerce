<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FM E-commerce</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header><strong>FM E-commerce</strong><nav aria-label="Store navigation"><a href="/">Store</a><a href="#products">Products</a></nav><span>Marketplace</span></header>
<main>
<section class="hero"><p class="eyebrow">FM MARKETPLACE</p><h1>Products, gifts &amp; watches</h1><p>Independent commerce foundation with a clean storefront. Public administration controls are kept outside the storefront.</p></section>
<section id="products"><div class="section-head"><h2>Products</h2><button id="refresh">Refresh</button></div><div id="product-grid" class="grid"></div></section>
<section class="ai-section" id="fm-ai"><div class="section-head"><div><p class="eyebrow">FM AI</p><h2>Shopping Assistant</h2></div></div>
<div class="ai-box"><div id="ai-messages" class="ai-messages" aria-live="polite"></div><form id="ai-chat"><input id="ai-input" maxlength="4000" placeholder="Ask about products, prices or stock…" autocomplete="off" required><button type="submit">Ask AI</button></form></div></section>
</main>
<script src="/app.js"></script>
</body></html>
