<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM E-commerce • Products</title><link rel="stylesheet" href="/styles.css"></head><body><header><strong>FM Admin</strong><a href="/">Storefront</a></header><main class="admin-panel"><h1>Products</h1><p>Read-only catalog. Authentication and writes remain disabled.</p><div id="status">Loading…</div><div id="products" class="admin-grid"></div><p><a href="/admin/inventory.html">Inventory</a> · <a href="/admin/orders.html">Orders</a></p></main><script>fetch('/api/admin/products').then(r=>r.json()).then(d=>{document.getElementById('status').textContent=d.ok?'Read-only':'Unavailable';document.getElementById('products').innerHTML=d.products.map(p=>`<article class="admin-card"><h2>${p.name}</h2><p>SKU: ${p.id}</p><p>Category: ${p.category}</p><p>Price: PKR ${Number(p.price).toLocaleString()}</p><p>Stock: ${p.stock}</p></article>`).join('')}).catch(()=>document.getElementById('status').textContent='API unavailable');</script></body></html>
