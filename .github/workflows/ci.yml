name: FM E-commerce CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog JSON
        run: python -m json.tool data/products.json >/dev/null
      - name: Check required storefront files
        run: test -f src/index.html && test -f src/app.js && test -f src/styles.css
      - name: Production publish
        run: echo "OFF — human approval required"
